<html>
  <head>

    <title>Creo Parametric TOOLKIT Creo APIWizard</title>

    <script language="JavaScript">

      function testSwingExistence()
      {
        if (document.TestSwingExistence.swingWasFound())
        {
          window.location.replace("MiscSwing.html");
        }
        else
        {
          window.location.replace("MiscNoSwingOptions.html");
        }
      }

    </script>

  </head>

  <body bgcolor="#ffffff" onLoad="testSwingExistence()">
    <center>

    <img src="images/ptc_logo.gif"><p>

    <h2>
      Testing for the existence of Java Foundation Classes (Swing).<br>
      Please Wait.
    </h2>

    </center>

    <applet
      code=TestSwingExistence.class
      archive="APIWizardStartup.jar"
      name="TestSwingExistence"
      width=1
      height=1>
    </applet>

  </body>
</html>
