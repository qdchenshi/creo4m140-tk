 !

<html>
  <head>
    <title>Creo Parametric TOOLKIT Creo APIWizard</title>
  </head>

  <body bgcolor="#ffffff">

    <applet 
      code="apiwizard.class"
      codebase="."
      archive="APIWizardUI.jar, gnu.regexp-1.0.8/lib/gnu-regexp-1.0.8.jar, Manual.jar"
      width=100%
      height=100%
      name="apiwizard"
      mayscript
    >
    <param
      name=SCROLLING
      value="TRUE"
    >
    <param
      name=READYHTML
      value="NSCPSwingReady.html"
    >
    </applet>

  </body>
</html>
