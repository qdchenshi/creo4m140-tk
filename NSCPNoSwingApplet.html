<!----------------------------------------------------------------
 !
 !  NSCPNoSwingApplet.html (HTML FIle)
 !
 !    Used to start the APIWizard applet in Netscape browsers with
 !    the default virtual when the user does not have Swing.
 !
 !  02-MAR-00  J-01-04  BMW  $$1    Created.
 !
----------------------------------------------------------------->

<html>
  <head>
    <title>Creo Parametric TOOLKIT Creo APIWizard</title>
  </head>

  <body bgcolor="#ffffff">

    <applet 
      code="apiwizard.class"
      codebase="."
      archive="APIWizardUI.jar, swing.jar, gnu.regexp-1.0.8/lib/gnu-regexp-1.0.8.jar, Manual.jar"
      width=100%
      height=100%
      name="apiwizard"
      mayscript
    >
    <param
      name=SCROLLING
      value="TRUE"
    >
    <param
      name=READYHTML
      value="NSCPNoSwingReady.html"
    >
    </applet>

  </body>
</html>
