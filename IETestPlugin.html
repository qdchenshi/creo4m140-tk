<html>
  <head>
    <title>Creo Parametric TOOLKIT Creo APIWizard</title>
  </head>

  <body>

<!-- The Applet will be loaded by this Object
     tag if the Plugin exists  This applet will
     then cause the APIWizard Applet to be loaded
     by the plugin. -->

  <OBJECT
    classid="clsid:8AD9C840-044E-11D1-B3E9-00805F499D93"
    width=1
    height=1
  >
  <PARAM
    NAME="java_code"
    VALUE="IEPluginFound.class"
  >
  <PARAM
    NAME="java_codebase"
    VALUE = "."
  >
  <PARAM
    NAME="archive"
    VALUE="APIWizardStartup.jar"
  >
  <PARAM
    NAME="type"
    VALUE="application/x-java-applet;version=1.2"
  >
  
  <!-- The Applet will be loaded by this tag
       if the Plugin does not exist. This applet
       will then cause the APIWizard Applet to be
       loaded by the default virtual machine. -->
  
    <APPLET
      CODE="IEPluginNotFound.class"
      CODEBASE="."
      ARCHIVE="APIWizardStartup.jar"
      WIDTH=1
      HEIGHT=1 >
    </APPLET>
  
  </OBJECT>

  </body>
</html>
